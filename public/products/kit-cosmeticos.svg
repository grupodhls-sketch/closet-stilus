<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5E8F7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8D5F5;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="500" fill="url(#bg)"/>
  <!-- Cosmetic items -->
  <!-- Lipstick -->
  <rect x="140" y="140" width="30" height="80" rx="4" fill="#B88BEA" opacity="0.7"/>
  <rect x="145" y="130" width="20" height="20" rx="10" fill="#7E58B8" opacity="0.6"/>
  <rect x="140" y="190" width="30" height="8" fill="#D4AF37" opacity="0.5"/>
  <!-- Perfume bottle -->
  <rect x="210" y="150" width="50" height="70" rx="8" fill="#D9C3F7" opacity="0.6"/>
  <rect x="225" y="130" width="20" height="25" rx="3" fill="#D4AF37" opacity="0.5"/>
  <rect x="230" y="120" width="10" height="15" rx="2" fill="#C8A54B" opacity="0.4"/>
  <circle cx="235" cy="185" r="12" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.4"/>
  <!-- Compact mirror -->
  <ellipse cx="200" cy="300" rx="45" ry="30" fill="#B88BEA" opacity="0.4"/>
  <ellipse cx="200" cy="295" rx="35" ry="22" fill="#E8D5F5" opacity="0.6"/>
  <ellipse cx="200" cy="295" rx="25" ry="16" fill="#D9C3F7" opacity="0.3"/>
  <!-- Small items -->
  <circle cx="120" cy="300" r="12" fill="#D4AF37" opacity="0.3"/>
  <circle cx="290" cy="280" r="10" fill="#B88BEA" opacity="0.25"/>
  <!-- Sparkles -->
  <text x="100" y="120" font-size="16" opacity="0.3">✨</text>
  <text x="300" y="160" font-size="14" opacity="0.25">💜</text>
  <!-- Text -->
  <text x="200" y="400" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#7E58B8" font-weight="600">Kit Cosméticos</text>
  <text x="200" y="425" text-anchor="middle" font-family="Arial" font-size="13" fill="#9B7DB8">Stilus</text>
  <rect x="10" y="10" width="380" height="480" rx="16" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.2"/>
</svg>

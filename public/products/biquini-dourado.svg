<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5ECD5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8DCC5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C8A54B;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="500" fill="url(#bg)"/>
  <!-- Bikini top -->
  <path d="M160 160 Q180 130 200 140 Q220 130 240 160 Q220 180 200 175 Q180 180 160 160Z" fill="#D4AF37" opacity="0.7"/>
  <path d="M195 155 Q200 145 205 155" fill="none" stroke="#C8A54B" stroke-width="2"/>
  <!-- Bikini bottom -->
  <path d="M160 220 Q200 210 240 220 Q235 260 200 270 Q165 260 160 220Z" fill="#D4AF37" opacity="0.6"/>
  <!-- Strings -->
  <line x1="165" y1="160" x2="165" y2="200" stroke="#C8A54B" stroke-width="1.5" opacity="0.5"/>
  <line x1="235" y1="160" x2="235" y2="200" stroke="#C8A54B" stroke-width="1.5" opacity="0.5"/>
  <!-- Sparkles -->
  <text x="120" y="120" font-size="20" opacity="0.4">✨</text>
  <text x="270" y="140" font-size="16" opacity="0.3">✨</text>
  <text x="300" y="300" font-size="18" opacity="0.25">✨</text>
  <!-- Wave -->
  <path d="M50 350 Q100 330 150 350 Q200 370 250 350 Q300 330 350 350" fill="none" stroke="#D4AF37" stroke-width="1.5" opacity="0.2"/>
  <path d="M50 370 Q100 350 150 370 Q200 390 250 370 Q300 350 350 370" fill="none" stroke="#B88BEA" stroke-width="1" opacity="0.15"/>
  <!-- Text -->
  <text x="200" y="420" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#8B6914" font-weight="600">Biquíni Dourado</text>
  <text x="200" y="445" text-anchor="middle" font-family="Arial" font-size="13" fill="#A08530">Premium</text>
  <rect x="10" y="10" width="380" height="480" rx="16" fill="none" stroke="#D4AF37" stroke-width="1.5" opacity="0.25"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5E8F7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8D5F5;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="500" fill="url(#bg)"/>
  <!-- Camisole -->
  <path d="M155 120 Q200 100 245 120 L255 200 Q200 220 145 200 Z" fill="#D9C3F7" opacity="0.5"/>
  <path d="M150 200 Q200 220 250 200 L255 320 Q200 340 145 320 Z" fill="#B88BEA" opacity="0.4"/>
  <!-- Lace trim -->
  <path d="M148 315 Q165 325 182 315 Q200 325 218 315 Q235 325 252 315" fill="none" stroke="#D4AF37" stroke-width="1.5" opacity="0.5"/>
  <!-- Ribbon -->
  <path d="M185 195 Q200 205 215 195" fill="none" stroke="#D4AF37" stroke-width="2"/>
  <circle cx="200" cy="200" r="3" fill="#D4AF37"/>
  <!-- Gold accents -->
  <path d="M160 140 Q200 130 240 140" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.3"/>
  <!-- Sparkles -->
  <text x="110" y="150" font-size="14" opacity="0.3">✨</text>
  <text x="280" y="180" font-size="12" opacity="0.25">✨</text>
  <circle cx="300" cy="350" r="8" fill="#D4AF37" opacity="0.15"/>
  <circle cx="100" cy="370" r="6" fill="#B88BEA" opacity="0.2"/>
  <!-- Text -->
  <text x="200" y="400" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#7E58B8" font-weight="600">Camisola Renda</text>
  <text x="200" y="425" text-anchor="middle" font-family="Arial" font-size="13" fill="#9B7DB8">Dourada</text>
  <rect x="10" y="10" width="380" height="480" rx="16" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.2"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8D5F5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D9C3F7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C8A54B;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="500" fill="url(#bg)"/>
  <!-- Lace pattern -->
  <circle cx="200" cy="180" r="80" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.3"/>
  <circle cx="200" cy="180" r="60" fill="none" stroke="#B88BEA" stroke-width="1" opacity="0.4"/>
  <!-- Garment icon -->
  <path d="M160 140 Q200 120 240 140 L250 200 Q200 220 150 200 Z" fill="#B88BEA" opacity="0.6"/>
  <path d="M170 200 Q200 210 230 200 L225 280 Q200 290 175 280 Z" fill="#7E58B8" opacity="0.5"/>
  <ellipse cx="200" cy="280" rx="35" ry="15" fill="#D4AF37" opacity="0.4"/>
  <!-- Decorative flowers -->
  <circle cx="120" cy="100" r="8" fill="#B88BEA" opacity="0.3"/>
  <circle cx="280" cy="120" r="6" fill="#D4AF37" opacity="0.3"/>
  <circle cx="300" cy="350" r="10" fill="#B88BEA" opacity="0.2"/>
  <circle cx="100" cy="380" r="7" fill="#D4AF37" opacity="0.25"/>
  <!-- Text -->
  <text x="200" y="400" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#7E58B8" font-weight="600">Conjunto Lavanda</text>
  <text x="200" y="425" text-anchor="middle" font-family="Arial" font-size="13" fill="#9B7DB8">Delicado</text>
  <!-- Gold border -->
  <rect x="10" y="10" width="380" height="480" rx="16" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.2"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8D5F5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D9C3F7;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="500" fill="url(#bg)"/>
  <!-- Bikini top - lavender -->
  <path d="M155 160 Q175 130 200 140 Q225 130 245 160 Q225 185 200 180 Q175 185 155 160Z" fill="#B88BEA" opacity="0.6"/>
  <path d="M190 150 Q200 140 210 150" fill="none" stroke="#D4AF37" stroke-width="2" opacity="0.6"/>
  <!-- Bikini bottom -->
  <path d="M160 230 Q200 220 240 230 Q235 270 200 280 Q165 270 160 230Z" fill="#B88BEA" opacity="0.5"/>
  <!-- Strings -->
  <line x1="163" y1="160" x2="163" y2="210" stroke="#B88BEA" stroke-width="1.5" opacity="0.4"/>
  <line x1="237" y1="160" x2="237" y2="210" stroke="#B88BEA" stroke-width="1.5" opacity="0.4"/>
  <!-- Flowers -->
  <circle cx="120" cy="100" r="10" fill="#B88BEA" opacity="0.2"/>
  <circle cx="290" cy="130" r="8" fill="#D4AF37" opacity="0.25"/>
  <circle cx="300" cy="380" r="7" fill="#B88BEA" opacity="0.2"/>
  <!-- Wave -->
  <path d="M50 350 Q100 330 150 350 Q200 370 250 350 Q300 330 350 350" fill="none" stroke="#B88BEA" stroke-width="1.5" opacity="0.2"/>
  <!-- Text -->
  <text x="200" y="420" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#7E58B8" font-weight="600">Biquíni Lavanda</text>
  <text x="200" y="445" text-anchor="middle" font-family="Arial" font-size="13" fill="#9B7DB8">Clássico</text>
  <rect x="10" y="10" width="380" height="480" rx="16" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.2"/>
</svg>

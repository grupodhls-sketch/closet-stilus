<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5E0F0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8D5F5;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="500" fill="url(#bg)"/>
  <!-- Lipstick 1 -->
  <rect x="130" y="150" width="28" height="70" rx="4" fill="#B88BEA" opacity="0.7"/>
  <rect x="134" y="140" width="20" height="18" rx="9" fill="#7E58B8" opacity="0.6"/>
  <rect x="130" y="195" width="28" height="6" fill="#D4AF37" opacity="0.4"/>
  <!-- Lipstick 2 -->
  <rect x="170" y="160" width="28" height="70" rx="4" fill="#D9C3F7" opacity="0.6"/>
  <rect x="174" y="150" width="20" height="18" rx="9" fill="#B88BEA" opacity="0.5"/>
  <rect x="170" y="205" width="28" height="6" fill="#D4AF37" opacity="0.4"/>
  <!-- Gloss -->
  <rect x="220" y="140" width="20" height="90" rx="10" fill="#B88BEA" opacity="0.4"/>
  <rect x="224" y="125" width="12" height="20" rx="3" fill="#D4AF37" opacity="0.5"/>
  <circle cx="230" cy="190" r="6" fill="#D9C3F7" opacity="0.4"/>
  <!-- Swatches -->
  <circle cx="140" cy="300" r="15" fill="#B88BEA" opacity="0.4"/>
  <circle cx="180" cy="300" r="15" fill="#D9C3F7" opacity="0.4"/>
  <circle cx="220" cy="300" r="15" fill="#7E58B8" opacity="0.4"/>
  <circle cx="260" cy="300" r="15" fill="#D4AF37" opacity="0.3"/>
  <!-- Sparkles -->
  <text x="100" y="130" font-size="14" opacity="0.3">✨</text>
  <text x="290" y="170" font-size="12" opacity="0.25">💜</text>
  <!-- Text -->
  <text x="200" y="380" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#7E58B8" font-weight="600">Kit Batom + Gloss</text>
  <text x="200" y="405" text-anchor="middle" font-family="Arial" font-size="13" fill="#9B7DB8">Stilus</text>
  <rect x="10" y="10" width="380" height="480" rx="16" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.2"/>
</svg>

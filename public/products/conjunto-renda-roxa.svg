  <path d="M170 150 Q185 145 200 150 Q215 145 230 150" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.4"/>
  <path d="M175 170 Q190 165 200 170 Q210 165 225 170" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.3"/>

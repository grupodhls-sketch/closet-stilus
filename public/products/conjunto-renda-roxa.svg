  <!-- Text -->
  <text x="200" y="390" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#7E58B8" font-weight="600">Conjunto Renda</text>
  <text x="200" y="415" text-anchor="middle" font-family="Arial" font-size="13" fill="#9B7DB8">Roxa</text>
  <rect x="10" y="10" width="380" height="480" rx="16" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.2"/>
